image: python:3.12

# Dependencies resolve from public PyPI rather than pypi-internal. Nothing in this
# package's resolution graph is private — agentgraph-server and pydantic at runtime,
# pytest/pyright/ruff/twine/build in CI — and Artifactory serves a stale PyPI JSON simple
# index for pypi-internal (as of 2026-09-10 it stops at agentgraph-server 0.6.1 and
# agentgraph-connector-web 0.5.4, long after 0.7.0 and 0.5.6 published, while its HTML
# index is current). pip and uv both read the JSON index, so neither can satisfy this
# package's agentgraph-server>=0.7.0 floor from there. Artifactory is still where the
# built distribution is published, so the publish step keeps its credentials.

definitions:
  steps:
    - step: &verify
        name: Verify package
        caches:
          - pip
        script:
          - export PIP_DISABLE_PIP_VERSION_CHECK=1
          - export PIP_NO_CACHE_DIR=1
          - python -m venv .venv
          - .venv/bin/python -m pip install --upgrade pip
          - .venv/bin/python -m pip install . build twine 'pyright>=1.1.408' 'pytest>=9.0.2' 'pytest-asyncio>=1.3.0' 'ruff>=0.11.0'
          - .venv/bin/python -m pytest -q
          - .venv/bin/python -m ruff check .
          - .venv/bin/python -m pyright
          - .venv/bin/python -m build
          - .venv/bin/python -m twine check dist/*
          - python -m venv /tmp/package-smoke
          - /tmp/package-smoke/bin/python -m pip install dist/*.whl
          - /tmp/package-smoke/bin/agentgraph list-connectors

pipelines:
  pull-requests:
    '**':
      - step: *verify
  branches:
    main:
      - step: *verify
  tags:
    'v*':
      - step:
          <<: *verify
          name: Verify and publish package
          script:
            - pipe: atlassian/artifactory-sidekick:v1
            - source .artifactory/activate.sh
            - export PIP_DISABLE_PIP_VERSION_CHECK=1
            - export PIP_NO_CACHE_DIR=1
            - PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            - test "$BITBUCKET_TAG" = "v$PROJECT_VERSION"
            - python -m venv .venv
            - .venv/bin/python -m pip install --upgrade pip
            - .venv/bin/python -m pip install . build twine 'pyright>=1.1.408' 'pytest>=9.0.2' 'pytest-asyncio>=1.3.0' 'ruff>=0.11.0'
            - .venv/bin/python -m pytest -q
            - .venv/bin/python -m ruff check .
            - .venv/bin/python -m pyright
            - .venv/bin/python -m build
            - .venv/bin/python -m twine check dist/*
            - python -m venv /tmp/package-smoke
            - /tmp/package-smoke/bin/python -m pip install dist/*.whl
            - /tmp/package-smoke/bin/agentgraph list-connectors
            - export TWINE_USERNAME="$ARTIFACTORY_USERNAME"
            - export TWINE_PASSWORD="$ARTIFACTORY_PASSWORD"
            - .venv/bin/python -m twine upload --repository-url https://packages.atlassian.com/artifactory/api/pypi/pypi-private-local dist/*
