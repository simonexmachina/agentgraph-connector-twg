image: python:3.12

# Dependency resolution goes through uv rather than pip. Artifactory serves a stale PyPI
# JSON simple index for pypi-internal — as of 2026-09-10 it stops at agentgraph-server
# 0.6.1 and agentgraph-connector-web 0.5.4, many hours after 0.7.0 and 0.5.6 published —
# while its HTML index is current. pip prefers the JSON index and so cannot resolve this
# package's `agentgraph-server>=0.7.0` floor; uv reads the HTML index and resolves it.
# Once Artifactory reindexes, either resolver works and this can go back to pip.

definitions:
  steps:
    - step: &verify
        name: Verify package
        caches:
          - pip
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - export PIP_DISABLE_PIP_VERSION_CHECK=1
          - export PIP_NO_CACHE_DIR=1
          - export PIP_INDEX_URL="https://${ARTIFACTORY_USERNAME}:${ARTIFACTORY_PASSWORD}@packages.atlassian.com/artifactory/api/pypi/pypi-internal/simple"
          - export UV_INDEX_URL="$PIP_INDEX_URL"
          - python -m pip install uv
          - uv venv .venv
          - uv pip install --python .venv/bin/python . twine 'pyright>=1.1.408' 'pytest>=9.0.2' 'pytest-asyncio>=1.3.0' 'ruff>=0.11.0'
          - .venv/bin/python -m pytest -q
          - .venv/bin/python -m ruff check .
          - .venv/bin/python -m pyright
          - uv build --out-dir dist
          - .venv/bin/python -m twine check dist/*
          - uv venv /tmp/package-smoke
          - uv pip install --python /tmp/package-smoke/bin/python dist/*.whl
          - /tmp/package-smoke/bin/agentgraph list-connectors

pipelines:
  pull-requests:
    '**':
      - step: *verify
  branches:
    main:
      - step: *verify
  tags:
    'v*':
      - step:
          <<: *verify
          name: Verify and publish package
          script:
            - pipe: atlassian/artifactory-sidekick:v1
            - source .artifactory/activate.sh
            - export PIP_DISABLE_PIP_VERSION_CHECK=1
            - export PIP_NO_CACHE_DIR=1
            - export PIP_INDEX_URL="https://${ARTIFACTORY_USERNAME}:${ARTIFACTORY_PASSWORD}@packages.atlassian.com/artifactory/api/pypi/pypi-internal/simple"
            - export UV_INDEX_URL="$PIP_INDEX_URL"
            - PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            - test "$BITBUCKET_TAG" = "v$PROJECT_VERSION"
            - python -m pip install uv
            - uv venv .venv
            - uv pip install --python .venv/bin/python . twine 'pyright>=1.1.408' 'pytest>=9.0.2' 'pytest-asyncio>=1.3.0' 'ruff>=0.11.0'
            - .venv/bin/python -m pytest -q
            - .venv/bin/python -m ruff check .
            - .venv/bin/python -m pyright
            - uv build --out-dir dist
            - .venv/bin/python -m twine check dist/*
            - uv venv /tmp/package-smoke
            - uv pip install --python /tmp/package-smoke/bin/python dist/*.whl
            - /tmp/package-smoke/bin/agentgraph list-connectors
            - export TWINE_USERNAME="$ARTIFACTORY_USERNAME"
            - export TWINE_PASSWORD="$ARTIFACTORY_PASSWORD"
            - .venv/bin/python -m twine upload --repository-url https://packages.atlassian.com/artifactory/api/pypi/pypi-private-local dist/*
